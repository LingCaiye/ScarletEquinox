<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <!-- 关键：移动端视口 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#667eea">
  <link rel="preload" as="image" type="image/webp" href="images/20210312234339_887ff.webp" fetchpriority="high">
  <title>春晓红雾缘~Scarlet Equinox</title>
  <!-- 首次绘制前标记 JS 可用：默认显示高清图，只有 JS 就绪时才改为「先隐藏、加载完再淡入」 -->
  <script>document.documentElement.classList.add('js');</script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #f5f5f5;
    }

    /* ===== 海报区 ===== */
    .poster {
      --poster-bg: url("images/20210312234339_887ff.webp");
      height: 100dvh;              /* dvh 适配手机地址栏 */
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #fff;
      text-align: center;
      padding: 2rem 1.5rem;
      position: relative;
      overflow: hidden;
    }
    .poster::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(rgba(0, 0, 0, 0.25), rgba(0, 0, 0, 0.25)),
        var(--poster-bg) center / cover no-repeat;
      opacity: 0;
      animation: poster-bg-fade 1.2s ease 0.15s forwards;
      z-index: 0;
    }
    /* 首屏：--poster-bg 换成内联的 40x56 低清图（440 B），首帧即出现模糊底图，
       零额外请求。高清图放在 ::after 单独淡入。
       注意渐变遮罩只留在 ::before 这一层：两层各叠加一次 0.25 黑，
       实际会压暗到 1-(0.75*0.75)≈0.44，高清图淡入完成后画面会明显变黑。 */
    .poster--first {
      --poster-bg: url("data:image/webp;base64,UklGRkABAABXRUJQVlA4IDQBAABwCgCdASooADgAPu1aqE2ppKOiLVzMkTAdiUAXZoagEqxwtlDr/4N3+a2H5xjCupGbyjPIdjHJGFcm3Utdk+WLt5aNhqjQiA198+98tBGRvRCk11AZE5hOf7P3AADhFw12lIwCOfhDR/l5d5Krq/L4IIhSdgJLnpYKIPS+2+BXU0qVuhOYoCatbZfOK2tm4rj/RoefO0tsw2oGofUebIbK5gxThkWMq+215FRBQqlgPnohts0J+mQSPC18MXADzavcGx7RRzQIvdnpJSIkefGrJIeceTZAFBUqURRiNKXvoau5mg8uf4xmDIQxyRfsjzfoa8oFbTUGr//mDt0XAZ1FW1Qkp5wVfPOwg3VJlZ4LRU4NZe/4xFHdIxC2/o7e9TMLRJJkWfzKm/ou5yJi/j89uBMAAA==");
      --poster-hd: url("images/20210312234339_887ff.webp");
    }
    /* 背景写在基础规则里，样式首次计算时就发起请求，不依赖 JS */
    .poster--first::after {
      content: "";
      position: absolute;
      inset: 0;
      background: var(--poster-hd) center / cover no-repeat;
      opacity: 1;                     /* 无 JS 时的默认：直接可见 */
      transition: opacity 0.8s ease;
      z-index: 0;
      pointer-events: none;
    }
    html.js .poster--first::after { opacity: 0; }
    html.js .poster--first.poster--hd-loaded::after { opacity: 1; }
    .poster > * {
      position: relative;
      z-index: 1;
    }
    .poster--second {
      --poster-bg: url("images/20200329183010_eivcs.jpg");
    }
    .poster--third {
      --poster-bg: url("images/R-C.jpg");
    }
    .poster h1 {
      font-size: clamp(1.8rem, 8vw, 2.8rem);
      line-height: 1.3;
      margin-bottom: 1rem;
      letter-spacing: 2px;
      animation: fade-in 1s ease 1.5s both;
    }
    .poster p {
      font-size: clamp(0.9rem, 4vw, 1.1rem);
      opacity: 0.9;
      animation: fade-in 1s ease 2s both;
    }
    .scroll-hint {
      position: absolute;
      bottom: calc(2rem + env(safe-area-inset-bottom));
      font-size: 0.85rem;
      opacity: 0.7;
      animation: bounce 1.5s 2.6s infinite, fade-in-hint 0.8s ease 2.6s both;
    }
    @keyframes fade-in {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes poster-bg-fade {
      from {
        opacity: 0;
        transform: scale(1.08);
        filter: blur(4px) saturate(0.8);
      }
      to {
        opacity: 1;
        transform: scale(1);
        filter: blur(0) saturate(1);
      }
    }
    @keyframes fade-in-hint {
      from { opacity: 0; }
      to { opacity: 0.7; }
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(8px); }
    }

    /* ===== 按钮区：2×2 网格 ===== */
    .buttons {
      position: absolute;
      inset: 0;
      z-index: 1;
      min-height: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;   /* 两列 */
      gap: 1rem;
      padding: 2rem 1.25rem calc(5rem + env(safe-area-inset-bottom));
      align-content: center;
    }
    .btn {
      aspect-ratio: 1 / 1;              /* 正方形 */
      border-radius: 20px;
      background: #fff;
      box-shadow: 0 6px 20px rgba(0,0,0,0.08);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-size: 1rem;
      font-weight: 600;
      color: #333;
      text-decoration: none;
      opacity: 0;
      transform: translateY(24px);
      transition: opacity 0.5s, transform 0.5s, box-shadow 0.2s;
    }
    .btn.show {
      opacity: 1;
      transform: translateY(0);
    }
    /* 手机没有 hover，用 :active 做点击反馈 */
    .btn:active {
      transform: scale(0.95);
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .btn .icon {
      font-size: 1.8rem;
      margin-bottom: 0.5rem;
    }

    /* 大屏（平板/电脑）时切回一行四列 */
    @media (min-width: 768px) {
      .buttons {
        grid-template-columns: repeat(4, 1fr);
        gap: 2rem;
        padding: 4rem;
      }
      .btn { aspect-ratio: 1 / 1; font-size: 1.1rem; }
      .btn .icon { font-size: 2.5rem; }
    }

    /* 尊重系统「减弱动态效果」设置：poster-bg-fade 动的正是 transform/filter，
       属于最容易引起不适的一类动画。animation: none 会丢掉 fill-forwards，
       所以 opacity/transform/filter 必须显式复位。 */
    @media (prefers-reduced-motion: reduce) {
      .poster::before { animation: none; opacity: 1; transform: none; filter: none; }
      .poster--first::after { transition: none; }
    }
  </style>
</head>
<body>

  <section class="poster poster--first">
    <h1>春晓红雾缘 ~ Scarlet Equinox<br>长安区<br>五校例会02</h1>
    <p>向下滑动，探索更多</p>
    <div class="scroll-hint">↓ 滑动 ↓</div>
  </section>

  <section class="poster poster--second">
    <div class="buttons" id="buttons">
      <a href="club.html" class="btn"><span class="icon">☯️</span>参展社团</a>
      <a href="map.html" class="btn"><span class="icon">⛩️</span>场地预览</a>
      <a href="time.html" class="btn"><span class="icon">🧹</span>时间安排</a>
      <a href="game.html" class="btn"><span class="icon">⭐</span>场内小游戏</a>
    </div>
    <div class="scroll-hint">↓ 继续向下滑动 ↓</div>
  </section>

  <section class="poster poster--third" aria-label="第三张海报">
  </section>

  <script>
    /* 首屏背景：等高清图真正到达并且解码完成后再淡入，
       这样渐入的始终是完整的一帧，不会中途露出半张图。 */
    (function () {
      const poster = document.querySelector('.poster--first');
      if (!poster) return;

      let revealed = false;
      const reveal = () => {
        if (revealed) return;
        revealed = true;
        requestAnimationFrame(() => poster.classList.add('poster--hd-loaded'));
      };

      // 兜底：部分 WebKit 版本的 decode() Promise 既不 resolve 也不 reject，
      // 一旦卡住首屏会永远停在模糊图上，所以必须有时间上限。
      const guard = setTimeout(reveal, 8000);
      const finish = () => { clearTimeout(guard); reveal(); };

      const image = new Image();
      image.onload = () => {
        if (typeof image.decode === 'function') {
          // 成功和失败都要揭开：某些浏览器（尤其 iOS Safari）对已解码的图会 reject，
          // 但此时图片其实完全可用。
          image.decode().then(finish, finish);
        } else {
          finish();                   // 不支持 decode()，退回到 onload 即可
        }
      };
      // 加载失败就保持模糊底图，宁可不显示也不要露出破图
      image.onerror = () => {
        clearTimeout(guard);
        console.error('首屏高清背景加载失败，保留低清底图。');
      };
      image.src = 'images/20210312234339_887ff.webp';
    })();

    const btns = document.querySelectorAll('.btn');
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          setTimeout(() => {
            btns.forEach((btn, i) => {
              setTimeout(() => btn.classList.add('show'), i * 120);
            });
          }, 0);
          observer.disconnect();
        }
      });
    }, { threshold: 0.2 });

    observer.observe(document.getElementById('buttons'));
  </script>

</body>
</html>
